 turkfm_tanzimat_reform_agenda: "$turkfm_tanzimat$ #o #tooltip:[GetPlayer.GetTooltipTag],turkfm_tanzimat_reform_agenda_desc Reform Agenda#!#!"
 turkfm_tanzimat_reform_agenda_desc: "A #bold $turkfm_tanzimat$ Reform Agenda#! represents a stated goal of the $turkfm_ottomanists$ in their quest to modernize the empire. Completing Agendas will remove any maluses associated with them and boost overall Tanzimât progress towards the $turkfm_reformist$ outcome."
 turkfm_tanzimat_reform_agendas: "$turkfm_tanzimat_reform$ #o #tooltip:[GetPlayer.GetTooltipTag],turkfm_tanzimat_reform_agenda_desc Reform Agendas#!#!"
 turkfm_tanzimat_agenda: "$turkfm_tanzimat$ #o #tooltip:[GetPlayer.GetTooltipTag],turkfm_tanzimat_reform_agenda_desc Agenda#!#!"
 turkfm_tanzimat_agendas: "$turkfm_tanzimat$ #o #tooltip:[GetPlayer.GetTooltipTag],turkfm_tanzimat_reform_agenda_desc Agendas#!#!"
 turkfm_agenda_no_icon: "#o #tooltip:[GetPlayer.GetTooltipTag],turkfm_tanzimat_reform_agenda_desc Agenda#!#!"
 turkfm_agendas_no_icon: "#o #tooltip:[GetPlayer.GetTooltipTag],turkfm_tanzimat_reform_agenda_desc Agendas#!#!"
