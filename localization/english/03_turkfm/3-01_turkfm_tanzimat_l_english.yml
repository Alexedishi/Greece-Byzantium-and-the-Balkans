 je_turkfm_tanzimat_young_turks_fail: "The $turkfm_young_turks$ progress bar is at #v 100#!"

 # Journal Entry Lobby Text
 je_turkfm_tanzimat_main_lobby: "$gbbf_journal_lobby$\nFor decades, the Ottoman Empire has been in steady decline, with the powers of Europe gnawing at its borders and unrest spreading across its minorities. In the face of these threats, Sultan #bold Mahmud II#! has championed an era of reform, with the aim of creating a truly centralized bureaucracy to govern and unite the Empire."
 je_turkfm_tanzimat_young_turks_lobby: ""

