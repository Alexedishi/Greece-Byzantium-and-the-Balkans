 turkfm_young_ottoman_desc: "#header Young Ottomans#!$gbbf_linebreak_normal$#lore The ideology of the #bold Young Ottomans#! is not strictly codified, but its supporters generally agree that the solution to the woes of the Empire is the establishment of a constitutional government. They aim to establish a constitutional monarchy that fuses the ideals of Islamic jurisprudence with those of western Liberalism.#!$gbbf_linebreak_normal$$gbbf_interest_groups$ and $gbbf_agitators$ will support the Young Ottomans based on their stances to the following laws:\n • Positive approval of towards any of:\n#indent_newline:3 •[GetLawType('law_wealth_voting').GetName]#!\n#indent_newline:3 •[GetLawType('law_census_voting').GetName]#!\n#indent_newline:3 •[GetLawType('law_universal_suffrage').GetName]#!\n • Positive approval towards [GetLawType('law_state_religion').GetName]\n • Positive approval of towards any of:\n#indent_newline:3 •[GetLawType('law_parliamentary_republic').GetName]#!\n#indent_newline:3 •[GetLawType('law_presidential_republic').GetName]#!"
