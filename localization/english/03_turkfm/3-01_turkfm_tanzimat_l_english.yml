 turkfm_tanzimat_identity_agenda: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],turkfm_tanzimat_identity_agenda_desc Develop an Imperial Identity#!#! $turkfm_tanzimat_agenda$"
 turkfm_tanzimat_identity_agenda_desc: "Critical to the success of the $turkfm_tanzimat$ is the establishment of an $turkfm_imperial_identity$. Without this key factor, the $turkfm_reformist$ factions have no change of seeing the empire survive."
 turkfm_tanzimat_identity: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],turkfm_tanzimat_identity_agenda_desc Develop an Imperial Identity#!#!"
 
 turkfm_tanzimat_gulhane_agenda: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],turkfm_tanzimat_gulhane_desc Inaugurate the Tanzimât#!#! $turkfm_tanzimat_agenda$"
 turkfm_tanzimat_gulhane_desc: "The knowledge of the empire's desperate need of reform has become entrenched since the rule of $gbbf_bio_selim_iii$. Despite this, Sultan Mahmut II has hesitation in formally declaring reforms."
 turkfm_tanzimat_gulhane: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],turkfm_tanzimat_gulhane_desc Inaugurate the Tanzimât#!#!"
 
 turkfm_tanzimat_agriculture_agenda: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],turkfm_tanzimat_agriculture_desc Modernize Agricultural Methods#!#! $turkfm_tanzimat_agenda$"
 turkfm_tanzimat_agriculture_desc: "Agricultural and land practices have languished as a result of centuries under Ottoman rule. The Empire is a rural one, sometimes even aggressively so. Reform must come lest the threat of famine and decay continue to take root."
 turkfm_tanzimat_agriculture: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],turkfm_tanzimat_agriculture_desc Modernize Agricultural Methods#!#!"
 
 turkfm_tanzimat_military_agenda: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],turkfm_tanzimat_military_desc Reorganize the Army#!#! $turkfm_tanzimat_agenda$"
 turkfm_tanzimat_military_desc: "The #bold Auspicious Incident#! saw the institution of the Janissary Order dismantled and their leaders expunged from the Ottoman court. Despite this, the army remains woefully disorganized and outdated."
 turkfm_tanzimat_military: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],turkfm_tanzimat_military_desc Reorganize the Army#!#!"
 
 turkfm_tanzimat_civics_agenda: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],turkfm_tanzimat_civics_desc Organize the Bureaucracy#!#! $turkfm_tanzimat_agenda$"
 turkfm_tanzimat_civics_desc: "The "administration" of the Empire can hardly be described as such. Despite several attempts at reform, local beys continue to exercise autonomy, taxes are embezzled, and justice is informal. The Empire cannot hold itself together without a central authority."
 turkfm_tanzimat_civics: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],turkfm_tanzimat_civics_desc Organize the Bureaucracy#!#!"
 
 turkfm_tanzimat_economy_agenda: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],turkfm_tanzimat_economy_desc Reignite the Economy#!#! $turkfm_tanzimat_agenda$"
 turkfm_tanzimat_economy_desc: "Despite centuries of connection to European markets, the Ottoman economy is mostly agricultural. The production of finished goods is relegated to artisans and guilds, and the Empire cannot hope to keep pace with Western production methods."
 turkfm_tanzimat_economy: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],turkfm_tanzimat_economy_desc Reignite the Economy#!#!"
 
 turkfm_tanzimat_education_agenda: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],turkfm_tanzimat_education_desc Standardize Education Systems#!#! $turkfm_tanzimat_agenda$"
 turkfm_tanzimat_education_desc: "As the Empire lurches forward into modernity, the lack of formal educational institutions and widespread illiteracy have hamstrung both reforms and industry. While it comes with many risks, the Empire can longer suffer such widespread ignorance."
 turkfm_tanzimat_education: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],turkfm_tanzimat_education_desc Standardize Education Systems#!#!"
 
 turkfm_tanzimat_millet_agenda: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],turkfm_tanzimat_millet_desc Reform the Millet System#!#! $turkfm_tanzimat_agenda$"
 turkfm_tanzimat_millet_desc: "The Millet System has served as one of the cornerstones of the Imperial order since the Fall of Constantinople. In practice, however, it is anything but systematic. In providing broad authority to its non-Muslim populations, the Empire has hamstrung its ability to effectively implement and exercise law. While each community may fear the loss of their unique privileges, we must standardize this practice."
 turkfm_tanzimat_millet: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],turkfm_tanzimat_millet_desc Reform the Millet System#!#!"
 
 turkfm_tanzimat_security_agenda: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],turkfm_tanzimat_security_desc Establish Law Enforcement#!#! $turkfm_tanzimat_agenda$"
 turkfm_tanzimat_security_desc: "Policing and Penal Codes are woefully disorganized throughout the Empire. While the Sultan rules by decree and provides security to the areas near [ROOT.GetCountry.GetCapital.GetCityHubName], beyond our capital, local beys and autonomous rulers exercise their own authority over their subjects."
 turkfm_tanzimat_security: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],turkfm_tanzimat_security_desc Establish Law Enforcement#!#!"
 
 turkfm_tanzimat_slavery_agenda: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],turkfm_tanzimat_slavery_desc Abolish the Slave Trade#!#! $turkfm_tanzimat_agenda$"
 turkfm_tanzimat_slavery_desc: "Even before the Sultan's entrenchment in Constantinople, the slave trade has been a driver of the Ottoman economy. Yet this practice has fallen out of favor in the "civilized" world, and its continued tolerance by the central administration has been used to assail the standing of the $turkfm_porte$. It may be time to reassess the continued existence of this institution."
 turkfm_tanzimat_slavery: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],turkfm_tanzimat_slavery_desc Abolish the Slave Trade#!#!"
 
