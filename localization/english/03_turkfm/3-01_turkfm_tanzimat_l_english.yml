 je_turkfm_tanzimat_young_turks: "The Young Turks"
 je_turkfm_tanzimat_young_turks_reason: "As liberal and nationalist thought permeate the [ROOT.GetCountry.GetName], opposition movements have united with one mentality: The $turkfm_tanzimat$ is not enough to save the empire. With ideologies gathered from across the $gbbf_intelligentsia$, the Young Turks aim to force the $turkfm_porte$ to accept reforms regardless of the consequences for the state."
