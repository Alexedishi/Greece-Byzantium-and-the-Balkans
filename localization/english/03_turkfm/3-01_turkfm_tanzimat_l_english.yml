 # Tooltips
 turkfm_tanzimat: "@gbbf_tanzimat! #o #tooltip:[GetPlayer.GetTooltipTag],turkfm_tanzimat_desc Tanzimât#!#!"
 turkfm_tanzimat_desc: "@gbbf_tanzimat! #header The Tanzimât#!$gbbf_linebreak_normal$#bold The Tanzimât#!, Turkish for #italic Reorganization#!, refers to a a broad spectrum of liberalizing reforms that have been gaining traction in the #v Ottoman Empire#!. Since the turn of the century, observers from within and without have acknowledged that the Empire suffers from critical structural issues ranging from poor governance, outdated military practices, and a stagnant economy.\n\nIn response, the Sultans since $gbbf_bio_selim_iii$ have engaged in a series of cautious reforms. However, as the Empire begins to appear ever more tenuous, the $turkfm_porte$ has become ever more motivated in attempting aggressive reform of the Imperial apparatus. These reforms has been fraught with perils as entrenched interests act to protect their privileges.\n\nThe Tanzimât is broadly comprised of two major undercurrents. The first is the battle between the $turkfm_reformist$ and $turkfm_conservatist$ factions within the inner administration over the implementation of any and all reforms. The second is the struggle between the $turkfm_ottomanist$ and $turkfm_islamist$ factions which hold deeply conflicting views on what the ultimate solution is to binding the decaying Empire together."
 turkfm_tanzimat_reform: "@gbbf_tanzimat! #o #tooltip:[GetPlayer.GetTooltipTag],turkfm_tanzimat_desc Tanzimât Reform#!#!"
 turkfm_tanzimat_reforms: "@gbbf_tanzimat! #o #tooltip:[GetPlayer.GetTooltipTag],turkfm_tanzimat_desc Tanzimât Reforms#!#!"
 turkfm_tanzimat_no_icon: "#o #tooltip:[GetPlayer.GetTooltipTag],turkfm_tanzimat_desc Tanzimât#!#!"

 turkfm_identity: "@gbbf_identity! #o #tooltip:[GetPlayer.GetTooltipTag],turkfm_identity_desc Identity#!#!"
 turkfm_identity_desc: "@gbbf_identity! #header Imperial Identity#!$gbbf_linebreak_normal$Since its initial expansion, the Ottoman Empire has delegated several aspects of governance to religion-based confessional communities referred to as #italic millets#!. Growing western involvement in the Empire has exposed the people to the ideals of [GetTechnology('nationalism').GetName] which now threatens to tear the empire apart.\n\nIn response, the $turkfm_reformist$ movement has emerged from the $turkfm_porte$ which remains split on whether $turkfm_ottomanism$ or $turkfm_islamism$ is the solution to the Empire's woes. Meanwhile, they are opposed by the entrenched interests of the $turkfm_conservatist$ movement, a broad alignment of warlords and governors that see their authority threatened by the $turkfm_tanzimat$."
 turkfm_identities: "@gbbf_identity! #o #tooltip:[GetPlayer.GetTooltipTag],turkfm_identity_desc Identities#!#!"
 turkfm_imperial_identity: "@gbbf_identity! #o #tooltip:[GetPlayer.GetTooltipTag],turkfm_identity_desc Imperial Identity#!#!"
 
 turkfm_tanzimat_started: "[ROOT.GetCountry.GetNameNoFlag] has declared the start of the #bold $turkfm_tanzimat$ Reforms#!"
 turkfm_mahmud_dead_tt: "Sultan Mahmud II is dead"
 turkfm_tanzimat_declaration: "This will enable the $turkfm_tanzimat$ $turkfm_tanzimat_reform_agendas$"
 turkfm_reform_completed: "Number of completed #bold $turkfm_tanzimat$ Reforms#! increases by #green #bold 1#!#!"
 turkfm_young_turks_failed: "[ROOT.GetCountry.GetNameNoFlag] has failed the #bold $je_turkfm_tanzimat_young_turks$#! [concept_journal_entry]"
 turkfm_grand_collapse_possible: "The #bold $je_turkfm_sick_man_grand_collapse$#! [concept_journal_entry] will become possible"

 turkfm_reformist: "#greece #bold #tooltip:[GetPlayer.GetTooltipTag],turkfm_reformist_desc Reformist#!#!#!"
 turkfm_reformists: "#greece #bold #tooltip:[GetPlayer.GetTooltipTag],turkfm_reformist_desc Reformists#!#!#!"
 turkfm_reformist_desc: "The #bold Reformist#! movement consists of an intellectual current that ascribes the stagnation of the Ottoman Empire to the outdatedness and inefficiency of its institutions. Emerging from the scribal class, the reformists seek to introduce European administrative methods and centralize power as a means to preserve the integrity of the Empire"
 turkfm_reformist_sources: "#bold The following are potential sources of $turkfm_reformist$ progress:#!$com_ttdl$$com_nlpb$Completing #bold $je_turkfm_tanzimat_reforms$#! $turkfm_tanzimat_agendas$$com_nlpb$[concept_popularity] of a pro-$turkfm_reformist$ [concept_ruler]$com_nlpb$[concept_government] [concept_legitimacy]$com_nlpb$[concept_literacy] in [GetPlayer.GetCountry.GetNameNoFlag]$com_nlpb$[GetBuildingType('building_government_administration').GetName] $gbbf_buildings$ with the #yellow Secular Administration#! [concept_production_method] active$com_nlpb$[GetBuildingType('building_university').GetName] $gbbf_buildings$ with the #yellow Secular Academia#! [concept_production_method] active$com_nlpb$Total amount of [concept_institution] $gbbf_investment_levels$ in [GetPlayer.GetCountry.GetNameNoFlag]$com_nlpb$Running a [concept_bureaucracy] surplus$com_nlpb$Number of owned [concept_incorporated_state] and non-[concept_split_state] $gbbf_state_regions$ in $gbbf_georegion_rumelia$ and $gbbf_georegion_anatolia$$com_nlpb$$gbbf_bolstering$ the #bold $movement_gbbf_ottomanist$#!$com_nlpb$$gbbf_suppressing$ the #bold $movement_gbbf_ottomanist$#!$com_nlpb$Enacting [GetLawType('law_slavery_banned').GetName]$com_nlpb$$gbbf_commander_impact$ of $turkfm_reformist$ [concept_army] $gbbf_commanders$ in [GetPlayer.GetCountry.GetNameNoFlag]$com_nlpb$[concept_prominence] of $turkfm_reformist$ [concept_interest_group] $gbbf_leaders$ in [GetPlayer.GetCountry.GetNameNoFlag]"

 turkfm_conservatist: "#purple #bold #tooltip:[GetPlayer.GetTooltipTag],turkfm_conservatist_desc Conservatist#!#!#!"
 turkfm_conservatists: "#purple #bold #tooltip:[GetPlayer.GetTooltipTag],turkfm_conservatist_desc Conservatists#!#!#!"
 turkfm_conservatist_desc: "The #bold Conservatist#! movement consists of entrenched aristocrats, clergy, and scribes that see any attempts at reform as a threat to their wealth and prestige. With their generations of established wealth and influence, they present a threat to the continued rule of the Sultan."
 turkfm_conservatist_sources: "#bold The following are potential sources of $turkfm_conservatist$ progress:#!$com_ttdl$$com_nlpb$[GetBuildingType('building_government_administration').GetName] $gbbf_buildings$ with the #yellow Administrative Clergy#! [concept_production_method] active$com_nlpb$[GetBuildingType('building_university').GetName] $gbbf_buildings$ with the #yellow Clerical Educators#! [concept_production_method] active$com_nlpb$Total amount of [GetInstitutionType('institution_schools').GetName] $gbbf_investment_levels$ while [GetLawType('law_religious_schools').GetName] is active$com_nlpb$Total amount of [GetInstitutionType('institution_health_system').GetName] $gbbf_investment_levels$ while [GetLawType('law_charitable_health_system').GetName] is active$com_nlpb$Active [GetLawGroup('lawgroup_church_and_state').GetName] [concept_law]$com_nlpb$Having an [concept_authority] surplus$com_nlpb$Number of owned [concept_unincorporated_state] or [concept_split_state] $gbbf_state_regions$ in $gbbf_georegion_rumelia$ and $gbbf_georegion_anatolia$$com_nlpb$$gbbf_bolstering$ the #bold $movement_religious_majority$#!$com_nlpb$$gbbf_suppressing$ the #bold $movement_religious_majority$#!$com_nlpb$$gbbf_commander_impact_short$ of $turkfm_conservatist$ [concept_army] $gbbf_commanders$ in [GetPlayer.GetCountry.GetNameNoFlag]$com_nlpb$[concept_prominence] of $turkfm_conservatist$ [concept_interest_group] $gbbf_leaders$ in [GetPlayer.GetCountry.GetNameNoFlag]"

 turkfm_ottomanist: "#yellow #bold #tooltip:[GetPlayer.GetTooltipTag],turkfm_ottomanist_desc Ottomanist#!#!#!"
 turkfm_ottomanists: "#yellow #bold #tooltip:[GetPlayer.GetTooltipTag],turkfm_ottomanist_desc Ottomanists#!#!#!"
 turkfm_ottomanism: "#yellow #bold #tooltip:[GetPlayer.GetTooltipTag],turkfm_ottomanist_desc Ottomanism#!#!#!"
 turkfm_ottomanist_desc: "The [GetIdeology('ideology_gbbf_ottomanist').GetName] movement is comprised of an array of intellectuals that advocate for more ambitious reforms beyond those of the $turkfm_reformist$ movement. They aim to syncretize Islamic jurisprudence with that of Western [GetTechnology('nationalism').GetName] to produce an overarching "Ottoman" identity to unite the Empire."
 turkfm_ottomanist_sources: "#bold The following are potential sources of $turkfm_ottomanist$ progress:#!$gbbf_linebreak_normal$ • The \n • The [concept_political_movement_support] behind the #bold [GetIdeology('ideology_modernizer').GetName] Movement#!$com_nlpb$[concept_political_movement_support] behind the [GetIdeology('ideology_gbbf_ottomanist').GetName], [GetIdeology('ideology_modernizer_movement_1').GetName], [GetIdeology('ideology_liberal_movement').GetName], [GetIdeology('ideology_land_reformer_movement').GetName], [GetIdeology('ideology_pluralist_movement_3').GetName], and [GetIdeology('ideology_anti_slavery_movement').GetName] $gbbf_movements$$com_nlpb$$gbbf_character_impact$ of $turkfm_reformist$ $gbbf_characters$ in [GetPlayer.GetCountry.GetNameNoFlag]$com_nlpb$[concept_clout] of $gbbf_interest_groups$ aligning with the $turkfm_reformists$$com_nlpb$Average progressiveness of $gbbf_laws$ in [GetPlayer.GetCountry.GetNameNoFlag]"
 
 turkfm_islamist: "#green #bold #tooltip:[GetPlayer.GetTooltipTag],turkfm_islamist_desc Islamist#!#!#!"
 turkfm_islamists: "#green #bold #tooltip:[GetPlayer.GetTooltipTag],turkfm_islamist_desc Islamists#!#!#!"
 turkfm_islamism: "#green #bold #tooltip:[GetPlayer.GetTooltipTag],turkfm_islamist_desc Islamism#!#!#!"
 turkfm_islamist_desc: "The [GetIdeology('ideology_gbbf_islamist_leader').GetName] identity is backed by a mixture of clergy and conservative elements who hold Islam and its systems of jurisprudence as the only means to hold the Empire together. They aim to enshrine the system of Sharia and Qanun and as the only future for the Empire to the detriment of members of its millets."
 turkfm_islamist_sources: "#bold The following are potential sources of $turkfm_islamist$ progress:#!$com_ttdl$$com_nlpb$The [concept_political_movement_support] behind the [GetIdeology('ideology_traditionalist_movement').GetName], [GetIdeology('ideology_absolutist_movement').GetName], and [GetIdeology('ideology_reactionary_movement').GetName] $gbbf_movements$$com_nlpb$$gbbf_character_impact$ of $turkfm_conservatist$ $gbbf_characters$ in [GetPlayer.GetCountry.GetNameNoFlag]$com_nlpb$[concept_clout] of $gbbf_interest_groups$ aligning with the $turkfm_conservatists$$com_nlpb$average regressiveness of $gbbf_laws$ in [GetPlayer.GetCountry.GetNameNoFlag]"

