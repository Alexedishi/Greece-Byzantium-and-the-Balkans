 je_turkfm_tanzimat_young_ottomans: "The Young Ottomans"
 je_turkfm_tanzimat_young_ottomans_reason: "With the ascent of [ROOT.GetCountry.GetRuler.GetFirstName] as the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] of the [ROOT.GetCountry.GetName], the ideals of the $turkfm_tanzimat$ have come under threat. Instead of civic reforms for the good of the Empire, the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] seeks to consolidate power and redirect reforms towards authoritarian ends. In response, the $turkfm_young_ottomans$, a secret society within the $turkfm_ottomanist$ movement, has organized to seek the deposition of [ROOT.GetCountry.GetRuler.GetFirstName] and appoint his reform-minded brother, [SCOPE.sCharacter('turkfm_murad_scope').GetFirstName] to the throne.$gbbf_linebreak_normal$#white Currently, the $turkfm_young_ottoman$ plot has [GetPlayer.MakeScope.Var('turkfm_young_ottomans_var').GetValue] strength. This is expected to change by #greece #tooltippable;tooltip:[GetPlayer.GetTooltipTag],je_turkfm_tanzimat_young_ottomans_breakdown [GetPlayer.MakeScope.Var('turkfm_young_ottomans_progress_var').GetValue]#!#!.#!\n\n@warning! #red #bold #italic Should the $turkfm_young_ottoman$ plot reach #v 100#! strength, they will #bold depose#! [ROOT.GetCountry.GetRuler.GetFirstName]!#!#!#!"
 je_turkfm_tanzimat_young_ottomans_breakdown: "[GetPlayer.MakeScope.GetScriptValueDesc('turkfm_young_ottomans_progress_value')]"
