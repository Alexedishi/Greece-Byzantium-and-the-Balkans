 # Decisions
 turkfm_palace_activation_decision: "Move Administration to [GetBuildingType('gbbf_building_dolmabahce_palace').GetName]"
 turkfm_palace_activation_decision_desc: "After years of planning and construction, artisans are finally adding the final details to our new palace. The time has come to solidify the $turkfm_tanzimat$ by moving the Imperial administration to these new facilities."
 turkfm_palace_upgrade_decision: "Modernize [GetBuildingType('gbbf_building_dolmabahce_palace').GetName]"
 turkfm_palace_upgrade_decision_desc: "While grandiose and auspicious, the royal palace lacks many of the conveniences afforded by modern technologies. It would serve the empire well to modernize the palace."
 turkfm_palace_museum_decision: "Open [GetBuildingType('gbbf_building_topkapi_palace').GetName] to the Public"
 turkfm_palace_museum_decision_desc: "The old palace of the empire now serves as little more than another hole in the maintenance budget. Scholars have suggested converting the storied structures into a public museum from which we can educate our subjects on the virtues of the empire."
 turkfm_suppress_circassian_slavery_decision: "Suppress Circassian Slave Trade"
 turkfm_suppress_circassian_slavery_decision_desc: ""

 # Notifications
 notification_turkfm_tanzimat_started_name: "#yellow Ottoman Empire#! Declares the #bold $turkfm_tanzimat$#!"
 notification_turkfm_tanzimat_started_desc: "Riding the wave of reform initiated by #yellow Selim III#!, the Sultan of the #yellow Ottoman Empire#! has declared ambitious plans to "Reorder" and modernize the Ottoman state."
 
 notification_turkfm_exiled_to_libya_name: "[SCOPE.sCharacter('exile_scope').GetFullName] exiled to #bold Libya#!."
 notification_turkfm_exiled_to_libya_desc: "[SCOPE.sCharacter('exile_scope').GetFullName] has been exiled to #bold Libya#! by [SCOPE.sCountry('ottoman_scope').GetName]."
 notification_turkfm_exiled_to_libya_tooltip: "#header $notification_turkfm_exiled_to_libya_name$#!\n$TOOLTIP_DELIMITER$\n$notification_turkfm_exiled_to_libya_desc$"

 # Scripted Buttons
 turkfm_start_tanzimat_name: "Declare the $turkfm_tanzimat$"
 turkfm_start_tanzimat_desc: "The Empire is both stagnant and rotting to its core. With some reforms completed and several more underway, all that remains is to give the Reorganization legal sanction by royal decree."
 turkfm_abolish_cizye_name: "Abolish the [GetAmendmentType('amendment_gbbf_cizye_tax').GetName]"
 turkfm_abolish_cizye_desc: "The [GetAmendmentType('amendment_gbbf_cizye_tax').GetName] has its roots in the Quran. In exchange for an exemption from military service, non-Muslims pay a head tax. While useful in diffusing conflicts with our subjects, this often hampers military recruitment."
 turkfm_abolish_chiftlik_name: "Abolish [GetAmendmentType('amendment_gbbf_chiftlik').GetName] Rights"
 turkfm_abolish_chiftlik_desc: "The [GetAmendmentType('amendment_gbbf_chiftlik').GetName] system is hardly a structured system at all. Rather, it represents the failure of the Sultan to assert central control over the Empire."
 turkfm_abolish_elifba_name: "Abolish the [GetAmendmentType('amendment_gbbf_elifba').GetName] Script"
 turkfm_abolish_elifba_desc: "Since the foundation of the Empire, all official documents have been written in the [GetAmendmentType('amendment_gbbf_elifba').GetName] script. While integral in linking the Empire to its Muslim subjects, reformers argue that it lays a significant role in impeding contact with the West."
 turkfm_abolish_esir_pazari_name: "Abolish [GetAmendmentType('amendment_gbbf_esir_pazari').GetName]"
 turkfm_abolish_esir_pazari_desc: "Over the last century, the Empire's specialized slave trade has drawn the ire of the Western powers. As abolitionists see increased in dismantling the slave trade abroad, the Sultan finds himself under increased pressure to suppress [GetAmendmentType('amendment_gbbf_esir_pazari').GetName]."
 
 turkfm_enforce_identity_name: "Embrace $turkfm_imperial_identity$"
 turkfm_enforce_identity_desc: "The tide of Western thought has threatened to tear the Empire apart. The $turkfm_porte$ must act decisively to secure a future foundation for the Empire, be it through $turkfm_ottomanism$ or $turkfm_islamism$."
 turkfm_enforce_identity_possible_1: "The #bold $turkfm_tanzimat_reforms$#! progress bar is full"
 turkfm_enforce_identity_possible_2: "The #bold $turkfm_imperial_identity$#! progress bar is within #v 10%#! of full support towards either identity"
 turkfm_enforce_identity_ottomanist: "The [ROOT.GetCountry.GetName] will adopt the [GetCulture('ottoman').GetName] culture as its core identity."
 turkfm_enforce_identity_button_islamist: "The [ROOT.GetCountry.GetName] will adopt [GetReligion('sunni').GetName] Islam as its core identity."
 turkfm_ottomanist_identity_effect: "The [ROOT.GetCountry.GetName] will adopt the $turkfm_identity$ with greater support."
 
 turkfm_depose_murad_name: "Depose [ROOT.GetCountry.GetRuler.GetFullName]"
 turkfm_depose_murad_desc: "Despite early hopes that he would lead the Empire into an era of modernity, [ROOT.GetCountry.GetRuler.GetFirstName] has been so badly afflicted by the death of his brother that any hope for his reign has been lost to his insanity. Several within the Circle have suggested that he be "retired" from office before any harm is done."

