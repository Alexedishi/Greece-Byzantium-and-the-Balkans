l_english:
 # Game Concepts
 concept_albanian_piracy: "Albanian Piracy"
 concept_albanian_piracy_desc: "Pirates have plied the coasts of the Adriatic since Roman times. Since the arrival of the Ottomans, several pirate bands have entrenched themselves in Albanian waters. As long as they are not dislodged, the region will experience #bold Piracy Events#!."
 
 concept_balkan_situation_involvement: "$gbbf_georegion_rumelia_adj$ Involvement"
 concept_balkan_situation_involvement_desc: "#bold $concept_balkan_situation_involvement$#! is a measure of how tangled up a [concept_country] has become in the fractious divisions in $gbbf_georegion_rumelia$. The more involved a country is, the more they are affected by and able to affect the $com_situation$.$com_ttdl$There are three tiers of involvement: $com_nlpb$$eqfm_involved$$com_nlpb$$eqfm_interloper$$com_nlpb$$eqfm_uninvolved$\n\nThis is further influenced by whether a country is $eqfm_rumelian_native_short$ to $gbbf_georegion_rumelia$ or an $eqfm_outsider$."
 concept_balkan_situation_involvement_short: "Involvement"
 concept_balkan_situation_involved: "Involved"
 concept_balkan_situation_interloper: "Interloper"
 concept_balkan_situation_uninvolved: "Uninvolved"
 
 concept_bedouin_tribes: "Bedouin Tribes"
 concept_bedouin_tribes_desc: "The #bold [GetCulture('bedouin').GetName] Tribes#! live in nomadic bands scattered across the [GetStateRegion('STATE_LIBYAN_DESERT').GetName] and [GetStateRegion('STATE_EGYPTIAN_DESERT').GetName]. Generally aloof to the maneuvering of the $gbbf_great_powers$, they tend to react poorly, even violently, once direct authority is imposed upon them."

 concept_beylik: "Beylik"
 concept_beylik_desc: "#bold Beylik#! is the name ascribed to a principality or petty kingdom ruled by a Bey. With the decline of the Byzantine Empire and Sultan of Rûm, beyliks came to dominate Anatolia before their annexation to the Ottoman Empire. Despite this, the title of #italic Bey#! endures, itself often used to assert independence from Constantinople."

 concept_concert_of_europe: "Concert of Europe"
 concept_concert_of_europe_desc: "The Concert of Europe is the informal political structure and balance of power that gives each country a [concept_rank], provides each [concept_great_power] with a sphere of influence, and has been a major step towards avoiding the conditions that led to the $FRA_ADJ$ Revolutionary War and the Napoleonic Wars."

 concept_eastern_question: "Eastern Question"
 concept_eastern_question_desc: "The Eastern Question is the unstable political situation caused by the decline of the Ottoman Empire. As the empire slowly crumbles from within, the $gbbf_great_powers$ struggle to find strategic and political solutions to expand their influence without disrupting the [concept_concert_of_europe]."

 concept_eyalet: "Eyalet"
 concept_eyalet_desc: "The #bold Eyalets#!, also called #italic Beylerbeyliks#! or #italic Pashaliks#!, are the primary administrative divisions of the Ottoman Empire. Originating in the years shortly after the Fall of Constantinople, the Eyalets function as a mixture of taxation and military administrations, with each headed by a Bey. While useful for the Empire's decentralized governance, this same system frequently hampers central authority."

 concept_kurdish_tribe: "Kurdish Tribe"
 concept_kurdish_tribe_desc: "A $concept_kurdish_tribe$ ([concept_subject]) is a highly autonomous [concept_subject_type] able to start their own $gbbf_diplomatic_plays$."
 
 concept_nile_floods: "Nile Floods"
 concept_nile_floods_desc: "The #bold Flooding of the Nile#! is a natural flooding cycle observed along the [GetGeographicRegion('geographic_region_lower_nile').GetName] resulting from the monsoon rains. Every few years, the Nile will experience the [GetHarvestConditionType('flood').GetName] [concept_harvest_condition]. This can be counteracted by constructing [GetBuildingType('gbbf_building_nile_barrage').GetName] $gbbf_buildings$.\n\nThese floods will inflict the #tooltippable;tooltip:[GetRawTextTooltipTag(GetStaticModifier('modifier_mgrbfm_widespread_nile_floods').GetDesc)] [GetStaticModifier('modifier_mgrbfm_widespread_nile_floods').GetName] [concept_modifier]#! according to the following flood stages:\n • #bold #blue Negligible (1-2)#!#!\n • #bold #green Mild (3-4)#!#!\n • #bold #yellow Heavy (5-6)#!#!\n • #bold #orange Severe (7-8)#!#!\n • #bold #red Catastrophic (9-10)#!#!"