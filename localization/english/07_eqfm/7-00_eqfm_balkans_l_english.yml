 eqfm_custom_deconfliction_next: "#bold #white Next Phase Progress#!:#!\n#italic Tensions will eventually transition into Stable#!\n#bold Progress Towards#! $eqfm_stable$: [JournalEntry.MakeScope.Var('eqfm_escalation_var').GetValue]/500"

 eqfm_custom_stable_factors: "@information!Catalysts towards the $eqfm_stable$ Phase\n$eqfm_balkan_powder_keg_escalation_factors_desc$"
 eqfm_custom_unrest_factors: "@information!Catalysts towards the $eqfm_unrest$ Phase\n$eqfm_balkan_powder_keg_escalation_factors_desc$"
 eqfm_custom_hostility_factors: "@information!Catalysts towards the $eqfm_hostility$ Phase\n$eqfm_balkan_powder_keg_escalation_factors_desc$"
