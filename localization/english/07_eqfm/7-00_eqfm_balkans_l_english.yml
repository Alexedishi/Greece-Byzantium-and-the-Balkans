l_english:
 # Journal Entries
 je_eqfm_balkan_powder_keg: "The Powder Keg of Europe"
 je_eqfm_balkan_powder_keg_reason: "[GetPlayer.GetCustom('eqfm_balkan_powder_keg_journal_flavor_type')]"
 je_eqfm_balkan_powder_keg_flavor_base: "The subjects of the [GetGlobalVariable('eqfm_balkan_situation').Var('ottoman_scope').GetCountry.GetNameNoFlag] grow ever more rebellious as the ideals of [GetTechnology('nationalism').GetName] take root across the Empire. Already the Empire has been shaken by rebellions in $GRE$ and $SER$, and the $RUS_ADJ$ Empire has secured seniority in the $ROM_ADJ$ Principalities. All eyes now turn to the $turkfm_porte$ to bring our [GetReligion('orthodox').GetName] subjects to heel.\n$gbbf_delimiter_normal$[GetPlayer.GetCustom('eqfm_balkan_powder_keg_escalation_progress_type')][GetPlayer.GetCustom('eqfm_balkan_powder_keg_deescalation_progress_type')]"
 je_eqfm_balkan_powder_keg_flavor_crisis: "A $eqfm_crisis$ is brewing in $gbbf_georegion_rumelia$, and the $eqfm_outsider$ powers must assert their authority over Rumelia as $gbbf_secessionists$ jeopardize imperial rule.\n\n@information! [concept_ottoman_integrity] is at #v [GetVariableFromGlobalVariableMap('eqfm_balkan_powder_keg_varmap', MakeScopeFlag('eqfm_balkan_powder_keg_crisis_var')).GetValue]/[GetPlayer.MakeScope.ScriptValue('eqfm_balkan_powder_keg_crisis_max_value')]#!. This is expected to change by #tooltippable;tooltip:[GetPlayer.GetTooltipTag],je_eqfm_balkan_powder_keg_crisis_breakdown [GetVariableFromGlobalVariableMap('eqfm_balkan_powder_keg_varmap', MakeScopeFlag('eqfm_balkan_powder_keg_crisis_progress_var')).GetValue|+=]#! next month."
 
 je_eqfm_balkan_powder_keg_escalation_details: "$com_nlpb$#bold #white Progress Towards [GetPlayer.GetCustom('eqfm_balkan_powder_keg_next_escalation_phase_type')]:#! #green [GetVariableFromGlobalVariableMap('eqfm_balkan_powder_keg_varmap', MakeScopeFlag('eqfm_balkan_powder_keg_escalation_var')).GetValue|-=]#!/500 ($eqfm_balkan_powder_keg_escalation_value_tooltippable$)"
 je_eqfm_balkan_powder_keg_deescalation_details: "$com_nlpb$#bold #white Progress Towards [GetPlayer.GetCustom('eqfm_balkan_powder_keg_next_deescalation_phase_type')]:#! #red [GetVariableFromGlobalVariableMap('eqfm_balkan_powder_keg_varmap', MakeScopeFlag('eqfm_balkan_powder_keg_deescalation_var')).GetValue|-=]#!/500 ($eqfm_balkan_powder_keg_deescalation_value_tooltippable$)"
 
 je_eqfm_balkan_powder_keg_crisis_breakdown: "[GetPlayer.MakeScope.GetScriptValueDesc('eqfm_balkan_powder_keg_crisis_progress_value')]"
 je_eqfm_balkan_powder_keg_status: "#bold #white Current Phase#!:#! [GetPlayer.GetCustom('eqfm_balkan_powder_keg_current_phase_type')]\n[GetPlayer.GetNameNoFlag] is [GetPlayer.GetCustom('eqfm_balkan_powder_keg_involvement_type')]"
 je_eqfm_balkan_powder_keg_crisis_status: "\n[concept_ottoman_integrity] is at #v [GetVariableFromGlobalVariableMap('eqfm_balkan_powder_keg_varmap', MakeScopeFlag('eqfm_balkan_powder_keg_crisis_var')).GetValue]/[GetPlayer.MakeScope.ScriptValue('eqfm_balkan_powder_keg_crisis_max_value')]#!"

 eqfm_balkan_powder_keg_escalation_factors: "#tooltippable #tooltip:[GetRawTextTooltipTag('eqfm_balkan_powder_keg_escalation_factors_desc')] Escalation Factors#!#!"
 eqfm_balkan_powder_keg_escalation_factors_desc: "#white #bold Expected Monthly Progress:#!#! $eqfm_balkan_powder_keg_escalation_value_tooltippable$ $com_ttdl$#white #bold Monthly Sources:#!#!\n • #bold #red +1#!:#! Base Monthly Progress\n • #bold #red +0.1×#!:#! Average [concept_radical] $gbbf_pops$ of $eqfm_rumelian_cultures$ (Max +8)\n • #bold #red +0.1×#!:#! Per Ottoman [concept_legitimacy] below 70 (max +3)\n • #bold #red +1×#!:#! Number of $gbbf_great_powers$ #bold Accelerating Tensions#!\n • #bold #red +3#!:#! Per Month if [GetTechnology('nationalism').GetName] is present in any [GetStrategicRegion('region_balkans').GetName] [concept_subject]\n#white #bold Instant Sources:#!#!\n • #bold #red +3#!:#! Enforce a [concept_war_goal] on the Ottomans\n • #bold #red +3#!:#! Expel Diplomats as a non-[concept_great_power]\n • #bold #red +5#!:#! Enforce a [concept_war_goal] on a Rumelian [concept_subject] as the Ottomans\n • #bold #red +5#!:#! Enforce a [concept_war_goal] on the Ottomans as a [concept_great_power]\n • #bold #red +10#!:#! Reduce [concept_autonomy] of a [GetStrategicRegion('region_balkans').GetName] [concept_subject]\n • #bold #red +10#!:#! Expel Ottoman Diplomats as a [concept_great_power]\n • #bold #red +10#!:#! Enforce a [concept_humiliation] [concept_war_goal] on the Ottomans\n • #bold #red +10#!:#! Declare a [concept_rivalry] against the Ottomans as a [concept_great_power]"
 eqfm_balkan_powder_keg_escalation_value_tooltippable: "#tooltippable;tooltip:[GetPlayer.GetTooltipTag],eqfm_balkan_powder_keg_escalation_factors_breakdown [GetVariableFromGlobalVariableMap('eqfm_balkan_powder_keg_varmap', MakeScopeFlag('eqfm_balkan_powder_keg_escalation_progress_var')).GetValue|-=]#!"
 eqfm_balkan_powder_keg_escalation_factors_breakdown: "[GetPlayer.MakeScope.GetScriptValueDesc('eqfm_balkan_powder_keg_escalation_progress_value')]"
 
 eqfm_balkan_powder_keg_deescalation_factors: "#tooltippable #tooltip:[GetRawTextTooltipTag('eqfm_balkan_powder_keg_deescalation_factors_desc')] Escalation Factors#!#!"
 eqfm_balkan_powder_keg_deescalation_factors_desc: "#white #bold Expected Monthly Progress:#!#! $eqfm_balkan_powder_keg_deescalation_value_tooltippable$ $com_ttdl$#white #bold Monthly Sources:#!#!\n • #bold #green +1#!:#! Base Monthly Progress\n • #bold #green +.01×#!:#! Average [concept_loyalist] $gbbf_pops$ of $eqfm_rumelian_cultures$ (Max +8)\n • #bold #green +0.1#!:#! From Ottoman [concept_legitimacy] above 70 (max +3)\n • #bold #green +1×#!:#! Number of countries Decelerating Tensions\n • #bold #green +1×#!:#! Bankroll [GetStrategicRegion('region_balkans').GetName] a [concept_subject] (per month)\n#white #bold Instant Sources:#!#!\n • #bold #green +3#!:#! Enforce a [concept_war_goal] against a non-[concept_great_power] as the Ottomans\n • #bold #green +5#!:#! Enforce a [concept_war_goal] against a [concept_great_power] as the Ottomans\n • #bold #green +10#!:#! Increase [concept_autonomy] of a [GetStrategicRegion('region_balkans').GetName] [concept_subject]\n • #bold #green +10#!:#! Declare an [concept_alliance] with the Ottomans as a [concept_great_power]\n • #bold #green +10#!:#! Increase the [concept_autonomy] of a [GetStrategicRegion('region_balkans').GetName] [concept_subject]\n • #bold #green +25#!:#! Grant a [GetStrategicRegion('region_balkans').GetName] Subject Independence"
 eqfm_balkan_powder_keg_deescalation_value_tooltippable: "#tooltippable;tooltip:[GetPlayer.GetTooltipTag],eqfm_balkan_powder_keg_deescalation_factors_breakdown [GetVariableFromGlobalVariableMap('eqfm_balkan_powder_keg_varmap', MakeScopeFlag('eqfm_balkan_powder_keg_deescalation_progress_var')).GetValue|+=]#!"
 eqfm_balkan_powder_keg_deescalation_factors_breakdown: "[GetPlayer.MakeScope.GetScriptValueDesc('eqfm_balkan_powder_keg_deescalation_progress_value')]"
 
 je_eqfm_balkan_powder_keg_outcome_domination_desc_1: "Either of the following:$com_nlpb$Owner is a $eqfm_rumelian_culture$ [concept_great_power]$com_nlpb$Owner is [concept_subject] to a [concept_great_power]"
 je_eqfm_balkan_powder_keg_outcome_domination_desc_2: "[concept_state] owner meets all of the following criteria: $com_nlpb$$TRIGGER_HAS_ANY_SECESSIONISTS_BROKEN_OUT_NOT$$com_nlpb$$TRIGGER_HAS_ANY_SECESSIONISTS_GROWING_NOT$$com_nlpb$$TRIGGER_IS_DIPLOMATIC_PLAY_COMMITTED_PARTICIPANT_NOT$"
 
 # Journal Entry Lobby Text
 je_eqfm_balkan_powder_keg_lobby: "$gbbf_journal_lobby$\nThe subjects of the Ottoman Empire grow ever more rebellious as the ideals of [GetTechnology('nationalism').GetName] take root across the Empire. Already the Empire has been shaken by rebellions in Greece and Serbia, and the $RUS_ADJ$ Empire has secured seniority in the Romanian Principalities. All eyes now turn to the #bold Sultan#! to bring his [GetReligion('orthodox').GetName] subjects to heel."

