 # Tooltips
 eqfm_balkan_situation: "@gbbf_nationalism! #o #tooltip:[GetRawTextTooltipTag('eqfm_balkan_situation_desc')] $je_eqfm_balkan_powder_keg$#!#!"
 eqfm_balkan_situation_desc: "#header @gbbf_nationalism! $je_eqfm_balkan_powder_keg$#!$gbbf_linebreak_normal$The #bold $je_eqfm_balkan_powder_keg$#! represents the ongoing struggle $eqfm_outsider$ administrations face in holding onto their possessions in the $gbbf_georegion_rumelia$ against the tide of [GetTechnology('nationalism').GetName].\n\n#lore It is widely held that the #bold Ottoman Empire#! has fallen from grace. Rocked by revolutions in Greece and Serbia and reeling from the Egyptian Revolt, the authority of the $turkfm_sublime_porte$ has come into question. With the Empire humiliated by the insults of the Treaty of Adrianople and Convention of Kütahya, many anticipate the imminent disintegration of the Sultanate. The Center struggles to mount a defense against the Great Powers, and its #o #tooltip:[GetRawTextTooltipTag('eqfm_rumelian_cultures_desc')] Balkan Subjects#!#! eye their chances to break free from the Empire.#!"
 eqfm_balkan_situation_no_icon: "#o #tooltip:[GetRawTextTooltipTag('eqfm_balkan_situation_desc')] $je_eqfm_balkan_powder_keg$#!#!"
 
 eqfm_involved: "#greece #tooltip:[GetRawTextTooltipTag('eqfm_involved_desc')] Involved#!#!"
 eqfm_involved_desc: "A level of $gbbf_balkans_involvement$ in the $eqfm_balkan_situation$. #bold Involved#! $gbbf_countries$ are naturally entangled in the fractious $com_situation$ by their circumstances. These participants are most affected by events occurring in $gbbf_georegion_rumelia$ and are also the most able to directly influence the progression of the situation.$com_ttdl$ A [concept_country] will become #bold Involved#! by any of the following:$com_bp$ Owning a [concept_state] in $gbbf_georegion_rumelia$ $com_bp$ Being [concept_overlord] to a [concept_country] in $gbbf_georegion_rumelia$ $com_bp$ Having a [concept_interest_tier] of #v 5 or greater#! in the $gbbf_strat_region_balkans$\n @information! #italic Different Actions will be available to you depending on your level of involvement.#!"

 eqfm_interloper: "#greece #tooltip:[GetRawTextTooltipTag('eqfm_interloper_desc')] Interloper#!#!"
 eqfm_interloper_desc: "A level of $gbbf_balkans_involvement$ in the $eqfm_balkan_situation$. #bold Interloper#! $gbbf_countries$ are partially entangled in the $com_situation$ but have little direct sway over events. These participants are usually unaffected by the goings-on in $gbbf_georegion_rumelia$, but can find themselves pulled in my political happenstance.$com_ttdl$ A [concept_country] will become an #bold Interloper#! by any of the following:$com_bp$ Having a [concept_interest_tier] of #v 3 or greater#! in the $gbbf_strat_region_balkans$ while not being $eqfm_involved$\n @information! #italic Different Actions will be available to you depending on your level of involvement.#!"
 
 eqfm_uninvolved: "#greece #tooltip:[GetRawTextTooltipTag('eqfm_uninvolved_desc')] Uninvolved#!#!"
 eqfm_uninvolved_desc: "A level of $gbbf_balkans_involvement$ in the $eqfm_balkan_situation$. #bold Interloper#! An #bold Uninvolved#! [concept_country] has no stake in the outcome of the $eqfm_balkan_situation$. These countries are unaffected by the events in $gbbf_georegion_rumelia$.\n\n@information! #italic Different Actions will be available to you depending on your level of involvement.#!"
 
 eqfm_rumelian_cultures: "#yellow #tooltip:[GetRawTextTooltipTag('eqfm_rumelian_cultures_desc')] $gbbf_georegion_rumelia_adj$ Cultures#!#!"
 eqfm_rumelian_cultures_desc: "@gbbf_identity! #header $gbbf_georegion_rumelia_adj$ Cultures:#!$com_ttdl$The following $gbbf_cultures$ have $gbbf_homelands$ in $gbbf_georegion_rumelia$:$com_nlpb$[GetCulture('greek').GetName]$com_nlpb$[GetCulture('rhomaios').GetName]$com_nlpb$[GetCulture('montenegrin').GetName]$com_nlpb$[GetCulture('serb').GetName]$com_nlpb$[GetCulture('bulgarian').GetName]$com_nlpb$[GetCulture('romanian').GetName]$com_nlpb$[GetCulture('bosniak').GetName]$com_nlpb$[GetCulture('croat').GetName]$com_nlpb$[GetCulture('slovene').GetName]$com_nlpb$[GetCulture('albanian').GetName]$com_nlpb$[GetCulture('aromanian').GetName]$com_nlpb$[GetCulture('romani').GetName]"
 eqfm_rumelian_culture: "#yellow #tooltip:[GetRawTextTooltipTag('eqfm_rumelian_cultures_desc')] $gbbf_georegion_rumelia_adj$ Culture#!#!"
 eqfm_rumelian_subject: "#yellow #tooltip:[GetRawTextTooltipTag('eqfm_rumelian_cultures_desc')] $gbbf_georegion_rumelia_adj$ Subject#!#!"
 eqfm_rumelian_subjects: "#yellow #tooltip:[GetRawTextTooltipTag('eqfm_rumelian_cultures_desc')] $gbbf_georegion_rumelia_adj$ Subjects#!#!"
 eqfm_rumelian_native: "#blue #tooltip:[GetRawTextTooltipTag('eqfm_rumelian_cultures_desc')] $gbbf_georegion_rumelia_adj$ Native#!#!"
 eqfm_rumelian_native_short: "#blue #tooltip:[GetRawTextTooltipTag('eqfm_rumelian_cultures_desc')] Native#!#!"
 eqfm_rumelian_natives: "#blue #tooltip:[GetRawTextTooltipTag('eqfm_rumelian_cultures_desc')] $gbbf_georegion_rumelia_adj$ Natives#!#!"
 eqfm_rumelian_natives_short: "#blue #tooltip:[GetRawTextTooltipTag('eqfm_rumelian_cultures_desc')] Natives#!#!"
 eqfm_rumelian: "#yellow #tooltip:[GetRawTextTooltipTag('eqfm_rumelian_cultures_desc')] Rumelian#!#!"
 eqfm_rumelians: "#yellow #tooltip:[GetRawTextTooltipTag('eqfm_rumelian_cultures_desc')] Rumelians#!#!"
 
 eqfm_outsider: "#blue #tooltip:[GetRawTextTooltipTag('eqfm_outsider_desc')] $gbbf_georegion_rumelia_adj$ Outsider#!#!"
 eqfm_outsider_desc: "#bold Outsider#! $gbbf_countries$ are those that lack $gbbf_homelands$ in $gbbf_georegion_rumelia$, yet own $gbbf_states$ in the $gbbf_georegion_short$. The spread of Nationalist thought means that these actors are increasingly seen as occupiers and imperialists who seek to oppress the $eqfm_rumelian_cultures$."
 
 eqfm_stable: "@gbbf_stable! #bold #green #tooltip:[GetRawTextTooltipTag('eqfm_stable_desc')] Stable#!#!#!"
 eqfm_stable_desc: "@gbbf_stable! #bold #green Stable#!#!$gbbf_linebreak_normal$One of the phases in $eqfm_balkan_situation$.\n\nAfter mending burned bridges during the $eqfm_deconfliction$ phase, people have slowly begun to remember what is was that brought them to blows in the first place. Eventually, disputes and misunderstandings will cause an escalation into the $eqfm_unrest$ phase.$gbbf_linebreak_normal$$eqfm_stable_effects$"
 eqfm_stable_effects: "This phase provides the following effects:\n[GetStaticModifier('modifier_eqfm_stable_phase').GetDesc]"
 eqfm_stable_no_icon: "#bold #green #tooltip:[GetRawTextTooltipTag('eqfm_stable_desc')] Stable#!#!#!"
 eqfm_stable_icon_only: "#tooltip:[GetRawTextTooltipTag('eqfm_stable_desc')] @gbbf_stable!#!"
 
 eqfm_unrest: "@gbbf_unrest! #bold #yellow #tooltip:[GetRawTextTooltipTag('eqfm_unrest_desc')] Unrest#!#!#!"
 eqfm_unrest_desc: "@gbbf_unrest! #bold #yellow Unrest#!#!$gbbf_linebreak_normal$One of the phases in $eqfm_balkan_situation$.\n\nFear and paranoia have once again brought the peoples of $gbbf_georegion_rumelia$ into conflict with their [GetCulture('turkish').GetName] rulers. As discrimination and deception takes hold in the streets, further insults will cause an escalation into the $eqfm_hostility$ phase.$gbbf_linebreak_normal$$eqfm_unrest_effects$"
 eqfm_unrest_effects: "This phase provides the following effects:\n[GetStaticModifier('modifier_eqfm_unrest_phase').GetDesc]"
 eqfm_unrest_no_icon: "#bold #yellow #tooltip:[GetRawTextTooltipTag('eqfm_unrest_desc')] Unrest#!#!#!"
 eqfm_unrest_icon_only: "#tooltip:[GetRawTextTooltipTag('eqfm_unrest_desc')] @gbbf_unrest!#!"
 
 eqfm_hostility: "@gbbf_hostility! #bold #red #tooltip:[GetRawTextTooltipTag('eqfm_hostility_desc')] Hostility#!#!#!"
 eqfm_hostility_desc: "@gbbf_hostility! #bold #red Hostility#!#!$gbbf_linebreak_normal$One of the phases in $eqfm_balkan_situation$.\n\nViolence has become routine across $gbbf_georegion_rumelia$ as widespread rejection of Ottoman rule takes root. If [GetTechnology('nationalism').GetName] has taken root in the Empire, and should the $eqfm_outsider$ $gbbf_great_powers$ fail to restore order, this may cause an escalation to the $eqfm_crisis$ phase. Should these tensions go unresolved, they will eventually sputter out, causing a deescalation to the $eqfm_deconfliction$ phase.$gbbf_linebreak_normal$$eqfm_hostility_effects$[GetPlayer.GetCustom('eqfm_balkan_powder_keg_crisis_ip3_dependency_type')]"
 eqfm_hostility_effects: "This phase provides the following effects:\n[GetStaticModifier('modifier_eqfm_hostility_phase').GetDesc]"
 eqfm_hostility_no_icon: "#bold #red #tooltip:[GetRawTextTooltipTag('eqfm_hostility_desc')] Hostility#!#!#!"
 eqfm_hostility_icon_only: "#tooltip:[GetRawTextTooltipTag('eqfm_hostility_desc')] @gbbf_hostility!#!"
 
 eqfm_deconfliction: "@gbbf_deconfliction! #bold #greece #tooltip:[GetRawTextTooltipTag('eqfm_deconfliction_desc')] Deconfliction#!#!#!"
 eqfm_deconfliction_desc: "@gbbf_deconfliction! #bold #greece Deconfliction#!#!$gbbf_linebreak_normal$One of the phases in $eqfm_balkan_situation$.\n\nIn the wake of widespread violence, tensions have found release through chaos and destruction in both city and countryside. As noble and peasant alike return to their daily lives, many question how the situation was able to get so far out of control. These conciliatory feelings will not last forever, leading to a natural escalation to the $eqfm_stable$ phase.$gbbf_linebreak_normal$$eqfm_deconfliction_effects$"
 eqfm_deconfliction_effects: "This phase provides the following effects:\n[GetStaticModifier('modifier_eqfm_deconfliction_phase').GetDesc]"
 eqfm_deconfliction_no_icon: "#bold #greece #tooltip:[GetRawTextTooltipTag('eqfm_deconfliction_desc')] Deconfliction#!#!#!"
 eqfm_deconfliction_icon_only: "#tooltip:[GetRawTextTooltipTag('eqfm_deconfliction_desc')] @gbbf_deconfliction!#!"
 
 eqfm_crisis: "@gbbf_crisis! #bold #red #tooltip:[GetRawTextTooltipTag('eqfm_crisis_desc')] Crisis#!#!#!"
 eqfm_crisis_desc: "@gbbf_crisis! #bold #red Crisis#!#!$gbbf_linebreak_normal$One of the phases in $eqfm_balkan_situation$.\n\nFollowing years of buildup, tensions have finally boiled over as [GetReligion('orthodox').GetName] and [GetReligion('jewish').GetName] populations seek to tear down the rule of the $turkfm_porte$ by any means necessary. With international eyes fixed on $gbbf_georegion_rumelia$, the Ottoman Empire faces widespread dissent from their subjects in Rumelia. $gbbf_great_powers$ will have the opportunity to support or hamper these movements. Should these tensions go unresolved, they will eventually sputter out, causing a deescalation to the $eqfm_deconfliction$ phase.$gbbf_linebreak_normal$$eqfm_crisis_effects$[GetPlayer.GetCustom('eqfm_balkan_powder_keg_crisis_ip3_dependency_type')]"
 eqfm_crisis_effects: "This phase provides the following effects:\n[GetStaticModifier('modifier_eqfm_crisis_phase').GetDesc]"
 eqfm_crisis_no_icon: "#bold #red #tooltip:[GetRawTextTooltipTag('eqfm_crisis_desc')] Crisis#!#!#!"
 eqfm_crisis_icon_only: "#tooltip:[GetRawTextTooltipTag('eqfm_crisis_desc')] @gbbf_crisis!#!"
 
